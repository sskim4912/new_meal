name: Submit requested test orders
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: requested-test-orders
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: meal_order_v2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: meal_order_v2/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/submit-test-orders.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-test-orders
          path: meal_order_v2/test-orders-report.json
          if-no-files-found: ignore
