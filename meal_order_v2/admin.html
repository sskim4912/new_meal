<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Project · 관리자 집계</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/admin.js"></script>
  </head>
  <body>
    <header>
      <div class="header">
        <div class="brand">
          <img src="assets/gs-logo.jpeg" alt="GS건설 로고" />
          <div>
            <strong>Aurora Project</strong><span>식사 신청 관리자</span>
          </div>
        </div>
        <a class="button" href="index.html">직원 화면</a>
      </div>
    </header>
    <main>
      <div class="page-heading">
        <p class="eyebrow">ADMIN · V2</p>
        <h1>식사 신청 집계</h1>
        <p>Firebase에 저장된 모든 기기의 신청 내역을 조회합니다.</p>
      </div>
      <button id="loginButton">관리자 비밀번호 입력</button>
      <div id="adminContent" hidden>
        <section class="panel">
          <div class="fields">
            <label
              >조회 방식<select id="viewMode">
                <option value="day">일별</option>
                <option value="month">월별</option>
              </select></label
            ><label id="dayField"
              >조회 날짜<input id="queryDate" type="date" /></label
            ><label id="monthField" hidden
              >조회 연월<input id="queryMonth" type="month" /></label
            ><label
              >신청자 구분<select id="queryGroup">
                <option value="all">전체</option>
              </select></label
            >
          </div>
          <div class="actions">
            <button id="queryButton" class="primary">조회</button
            ><button id="csvButton">CSV 다운로드</button
            ><button id="logoutButton">관리자 잠금</button>
          </div>
          <p id="adminStatus" class="status" aria-live="polite"></p>
        </section>
        <section
          id="totalCards"
          class="totals"
          aria-label="조회 요약"
        ></section>
        <section class="panel">
          <h2>상세 집계표</h2>
          <div id="groupedTable" class="table-wrap"></div>
        </section>
        <section class="panel">
          <h2>소계</h2>
          <div id="subtotalTable" class="table-wrap"></div>
        </section>
        <section id="dailyPanel" class="panel" hidden>
          <h2>월별 날짜 합계</h2>
          <div id="dailyTable" class="table-wrap"></div>
        </section>
        <section class="panel">
          <h2>신청자별 상세 내역</h2>
          <label
            >사번 · 이름 · 회사명/소속 · 장소 검색<input
              id="detailSearch"
              type="search"
              placeholder="검색어를 입력해주세요"
          /></label>
          <p class="subtle">
            검색은 상세 내역만 필터링하며 집계와 CSV에는 영향을 주지 않습니다.
          </p>
          <div id="detailTable" class="table-wrap"></div>
        </section>
        <section class="panel danger-panel">
          <h2>전체 신청 초기화</h2>
          <p>
            조회 조건과 관계없이 모든 날짜·모든 구분의 신청을 삭제합니다. 기억한
            기본정보는 유지됩니다.
          </p>
          <button id="resetAll" class="danger">전체 신청 초기화</button>
        </section>
      </div>
    </main>
    <footer>
      Aurora Project · 관리자 <span>정적 비밀번호는 실제 인증이 아닙니다.</span>
    </footer>
    <dialog id="passwordDialog">
      <h2>관리자 접근</h2>
      <form id="passwordForm">
        <label
          >비밀번호<input
            id="password"
            type="password"
            autocomplete="off"
            required
        /></label>
        <p id="passwordError" class="status error" aria-live="polite"></p>
        <div class="actions">
          <button type="button" id="closePassword">취소</button
          ><button class="primary">확인</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirmDialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText" class="confirm-text"></p>
      <form method="dialog" class="actions">
        <button value="no">취소</button
        ><button value="yes" class="primary">확인</button>
      </form>
    </dialog>
  </body>
</html>
